name: docker

on:
  pull_request:
  push:
    branches: [main]   # build-only on direct landings: Dockerfile rot caught here too
    tags: ["v*"]

# Conditional permissions are not supported (no expressions in the
# permissions block), so packages:write is granted only in the tag-only
# `publish` job below; build never logs in and never pushes.
permissions:
  contents: read

jobs:
  # PR + main: Dockerfile-rot check. Single-platform, no login, no push.
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No QEMU: the Dockerfile cross-compiles (FROM --platform=$BUILDPLATFORM +
      # dotnet publish -r linux-$TARGETARCH) — the SDK never runs emulated.
      - uses: docker/setup-buildx-action@v3

      - name: Image metadata (pr-N/branch tags, unused — build only)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ihsanfarabi/cs-agent

      - name: Build (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # cache export only on PR runs — main-push builds still RESTORE
          # via cache-from (see publish job for the multi-platform race note).
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,mode=max' || '' }}

  # Tag pushes: build both platforms, cross-compiled natively, and push one
  # multi-arch manifest to GHCR. Version tags come from the git tag, guarded
  # to equal the csproj Version (same guard publish.yml applies to NuGet —
  # they run in parallel on the same tag push; without this copy, a guard
  # failure there would still leave a public image with no matching package).
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write   # GitHub OIDC → cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Version guard (tag vs CsAgent.Cli.csproj)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/CsAgent.Cli/CsAgent.Cli.csproj)
          echo "tag: v$TAG  csproj Version: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match csproj Version $VERSION — bump the csproj or re-tag"
            exit 1
          fi

      # No QEMU: the Dockerfile cross-compiles (FROM --platform=$BUILDPLATFORM +
      # dotnet publish -r linux-$TARGETARCH) — the SDK never runs emulated.
      - uses: docker/setup-buildx-action@v3

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (vX.Y.Z, X.Y.Z, latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ihsanfarabi/cs-agent

      - name: Build + push (amd64 + arm64, one multi-arch manifest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildx SLSA in-toto provenance attached to the pushed index. Read it
          # with `docker buildx imagetools inspect`, NOT cosign verify-attestation
          # (it is a native buildx referrer, not a cosign-signed DSSE).
          provenance: true
          cache-from: type=gha
          # No cache-to: multi-platform GHA cache export is a known buildx race
          # where one per-platform export is lost (buildx #1382).

      # Keyless signing + SBOM attestation of the pushed manifest. The digest
      # (not the tag aliases) is signed — v0.5.0/0.5.0/latest point at the same
      # bytes, and per-alias signing would write duplicate signature manifests.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (keyless, manifest digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes ghcr.io/ihsanfarabi/cs-agent@$DIGEST

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/ihsanfarabi/cs-agent@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: cs-agent-sbom.cdx.json
          upload-artifact: false

      - name: Attach SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate cs-agent-sbom.cdx.json \
            ghcr.io/ihsanfarabi/cs-agent@$DIGEST