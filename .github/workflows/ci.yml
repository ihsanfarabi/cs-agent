name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      # Exit code IS the eval gate: EvalGateTests (scripted full-fixture eval
      # on the fake seam) rides the suite; a miss here is a red build.
      - run: dotnet test -c Release --no-build